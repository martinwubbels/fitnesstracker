<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitnessTracker</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f0f8f7"><style>body{font:16px system-ui;background:#101820;color:#edf3f7;margin:0}main{max-width:800px;margin:auto;padding:20px}h1{margin-bottom:4px}small,p{color:#aabac7}button,select,input{font:inherit;border:1px solid #415463;border-radius:8px;padding:10px;background:#223340;color:white}button{cursor:pointer}button.primary{background:#a8e0ba;color:#10251a;font-weight:bold}nav{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}article{background:#1a2833;border-radius:12px;padding:15px;margin:10px 0}label{display:block;font-size:12px;color:#b5c5cf}input[type=number]{width:65px}input[type=checkbox]{width:22px;height:22px;accent-color:#a8e0ba}.fields{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.muted{font-size:13px;color:#b5c5cf}svg{width:100%;height:auto}h3{margin:0 0 10px}button.active{border-color:#a8e0ba;color:#a8e0ba}body{background:#f0f8f7;color:#173b40}main{padding:20px}h1{color:#087e83;letter-spacing:-1px}small,p,.muted,label{color:#526e73}button,select,input{background:#fff;color:#173b40;border:1px solid #b8d8d6}button.primary{background:#087e83;color:white;border-color:#087e83}button.active{background:#d7f3ef;border-color:#0d9488;color:#075e59;font-weight:700}article{background:white;border:1px solid #dbeae8;box-shadow:0 3px 12px #164e6310;border-radius:16px}input[type=checkbox]{accent-color:#0d9488}h2{color:#176b70}h3{color:#234b50}nav{padding:8px;background:#e1f2ef;border-radius:12px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f5b85b;outline-offset:2px}button.primary:hover{background:#06666a}#count{color:#087e83;font-weight:700}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.calday{min-width:0;min-height:48px;padding:5px 1px;font-size:14 let data;try{data=JSON.parse(localStorage.getItem('fitness-v1'))||{logs:[],draft:null}}catch{data={logs:[],draft:null}};let day=data.draft?.day??((data.logs.at(-1)?.day??-1)+1)%3;let tab='Training';const v=document.getElementById('view');const save=()=>localStorage.setItem('fitness-v1',JSON.stringify(data));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function previous(n){return data.logs.filter(l=>l.day===day).flatMap(l=>l.items).filter(x=>x.n===n).at(-1)}function init(){data.draft={day,items:plans[day].map(([n,s,r,w,u])=>{let p=previous(n);return {n,s,r,w:p?.w??w,u,done:false,e:'normaal'}})};save()}if(!data.draft)init();const photos={"Leg Press":"leg-press","Vertical Chest":"vertical-chest","Overhead Press":"overhead-press","Rotary Torso":"rotary-torso","Lat Pull":"lat-pull","Mid Row":"mid-row","Loopband":"loopband","Crosstrainer":"crosstrainer","Hometrainer":"hometrainer","Leg Curl":"leg-curl","Chest Press":"chest-press","Pallof press":"cable","Cable Row":"cable","Cable Crunch":"cable","Cable Woodchop":"cable","Kneeling Cable Pulldown":"cable","Straight-arm Cable Pulldown":"cable","Romanian deadlift":"dumbbells","Farmer carry":"dumbbells","Suitcase carry":"dumbbells","Dumbbell Bench Press":"dumbbells","Dumbbell Row":"dumbbells","Dumbbell Shoulder Press":"dumbbells","Seated calf raise":"dumbbells","Seated dumbbell calf raise":"dumbbells","Static dumbbell hold":"dumbbells","Smith Machine Squat":"smith","Smith Machine Calf Raise":"smith"};function photo(n){const p=photos[n];return p?`<a href="./${p}.jpg" target="_blank" rel="noopener" aria-label="Vergroot apparaatfoto"><img loading="lazy" src="./${p}.jpg" alt="Apparaat of materiaal" style="width:88px;height:88px;object-fit:cover;border-radius:8px" onerror="this.parentElement.hidden=true"></a>`:""}let calDate=new Date();let selectedDate=null;const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');function moveMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);selectedDate=null;render()}function selectDate(k){selectedDate=k;render()}function calendar(){const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,total=new Date(y,m+1,0).getDate(),today=dateKey(new Date());const logs=data.logs.filter(l=>{const d=new Date(l.date);return d.getFullYear()===y&&d.getMonth()===m});const days=new Set(logs.map(l=>dateKey(new Date(l.date))));const items=logs.reduce((a,l)=>a+l.items.length,0);const sets=logs.reduce((a,l)=>a+l.items.reduce((b,x)=>b+Number(x.s||0),0),0);const cells=Array.from({length:offset},()=>'<span></span>');for(let i=1;i<=total;i++){const k=dateKey(new Date(y,m,i)),ls=logs.filter(l=>dateKey(new Date(l.date))===k);cells.push('<button class="calday '+(ls.length?'trained ':'')+(k===today?'today ':'')+(k===selectedDate?'chosen':'')+'" onclick="selectDate(\''+k+'\')" aria-label="'+k+', '+ls.length+' trainingen">'+i+(ls.length?'<small>Dag '+ls.map(l=>l.day+1).join(', ')+'</small>':'')+'</button>')}const chosen=selectedDate?logs.filter(l=>dateKey(new Date(l.date))===selectedDate):[];v.innerHTML='<h2>Trainingskalender</h2><div class="calstats"><article><strong>'+logs.length+'</strong><small>Trainingen</small></article><article><strong>'+days.size+'</strong><small>Trainingsdagen</small></article><article><strong>'+items+'</strong><small>Oefeningen</small></article><article><strong>'+sets+'</strong><small>Sets</small></article></div><article><div class="calhead"><button onclick="moveMonth(-1)" aria-label="Vorige maand">‹</button><h3>'+first.toLocaleDateString('nl-NL',{month:'long',year:'numeric'})+'</h3><button onclick="moveMonth(1)" aria-label="Volgende maand">›</button></div><div class="calgrid">'+['Ma','Di','Wo','Do','Vr','Za','Zo'].map(d=>'<small>'+d+'</small>').join('')+cells.join('')+'</div><p class="muted">Turquoise = getraind · Rand = vandaag</p><button onclick="calDate=new Date();selectedDate=dateKey(calDate);render()">Vandaag</button></article>'+(selectedDate?'<h3>'+new Date(selectedDate+'T12:00:00').toLocaleDateString('nl-NL',{dateStyle:'long'})+'</h3>'+(chosen.map(l=>'<article><h3>Dag '+(l.day+1)+'</h3>'+l.items.map(x=>'<div>'+esc(x.n)+': '+esc(x.s)+' × '+esc(x.r)+' · '+esc(x.w)+' '+esc(x.u)+'</div>').join('')+'</article>').join('')||'<p>Geen opgeslagen training op deze datum.</p>'):'<p>Tik op een datum om je training te bekijken.</p>')}function render(){document.getElementById('nav').innerHTML=['Training','Kalender','Voortgang','Historie','Apparaten','Backup'].map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');if(tab==='Training'){v.innerHTML=`<h2>Dag ${day+1}</h2><p>${['Kracht en pull-ups','Benen en wintersport','Bovenlichaam en pull-ups'][day]}</p><div class="fields">${plans.map((_,i)=>`<button onclick="switchDay(${i})">Dag ${i+1}</button>`).join('')}</div><p id="count"></p>`+data.draft.items.map((x,i)=>{let p=previous(x.n);let advice=p&&p.w>0&&p.s>=x.s&&p.r>=x.r&&p.e==='makkelijk'?'Overweeg de kleinste gewichtsstap bij goede techniek.':p?.e==='zwaar'?'Behoud of verlaag het gewicht.':'Behoud het voorgestelde gewicht.';return `<article><div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">${photo(x.n)}<h3>${i+1}. ${esc(x.n)}</h3></div><div class="muted">${p?'Laatste: '+p.s+' × '+p.r+' / '+p.w+' '+p.u:'Startvoorstel, geen geregistreerde prestatie'} · ${advice}</div><div class="fields">${[['s','Sets'],['r','Herh. / tijd'],['w','Gewicht']].map(([k,l])=>`<label>${l}<br><input type="number" min="${k==='w'?0:1}" step="${k==='w'?'0.5':'1'}" value="${x[k]}" onchange="edit(${i},'${k}',Number(this.value))"></label>`).join('')}<label>Ervaring<br><select onchange="edit(${i},'e',this.value)">${['makkelijk','normaal','zwaar'].map(e=>`<option ${x.e===e?'selected':''}>${e}</option>`).join('')}</select></label><label>Gedaan<br><input type="checkbox" ${x.done?'checked':''} onchange="edit(${i},'done',this.checked)"></label></div><small>${x.u}${x.n==='Vertical Chest'&&day===0?' · vierde set zo nodig 125 lb':''}</small><div style="margin-top:10px"><button onclick="chooseAlt(${i})">Alternatieve oefening</button>${x.original?`<p class="muted">Vervangt: ${esc(x.original)}</p>`:''}<div id="alt${i}"></div></div></article>`}).join('')+`<button class="primary" onclick="finish()">Training opslaan</button>`;count()}else if(tab==='Kalender'){calendar()}else if(tab==='Historie'){v.innerHTML='<h2>Trainingsgeschiedenis</h2>'+([...data.logs].reverse().map(l=>`<article><h3>${new Date(l.date).toLocaleDateString('nl-NL')} · Dag ${l.day+1}</h3>${l.items.map(x=>`<div>${esc(x.n)}: ${x.s} × ${x.r} · ${x.w} ${esc(x.u)}</div>`).join('')}</article>`).join('')||'<p>Nog geen opgeslagen trainingen.</p>')}else if(tab==='Voortgang'){let names=[...new Set([...plans.flat().map(x=>x[0]),...Object.values(alternatives).flat().map(x=>x[0]),...data.logs.flatMap(l=>l.items.map(x=>x.n))])];v.innerHTML=`<h2>Voortgang</h2><p>${data.logs.length} opgeslagen trainingen</p><select id="exercise" onchange="graph()">${names.map(n=>`<option>${n}</option>`).join('')}</select><div id="graph"></div>`;graph()}else if(tab==='Apparaten'){v.innerHTML='<h2>Beschikbare apparaten</h2>'+['Nautilus Leg Press','Nautilus Vertical Chest','Nautilus Overhead Press','Nautilus Rotary Torso','Pneumatische Lat Pull','Pneumatische Leg Press','Pneumatische Leg Extension','Pneumatische Leg Curl (werking controleren)','Pneumatische Chest Press','Pec Deck (vermoedelijk)','Heup adductor / abductor','Loopband','Stepper','Crosstrainer','Hometrainer','Optrekstang'].map(n=>`<article>${n}</article>`).join('')}else{v.innerHTML='<h2>Backup</h2><p>Gegevens blijven in deze browser. Exporteer regelmatig een backup. Er is geen automatische synchronisatie.</p><button onclick="backup()">Exporteren</button><p>Backup terugzetten (vervangt huidige gegevens):</p><input type="file" accept=".json" onchange="restore(this.files[0])">'}}function chooseAlt(i){const x=data.draft.items[i],base=x.original||x.n;const options=[plans[day].find(p=>p[0]===base),...(alternatives[base]||[])].filter(Boolean);const root=document.getElementById('alt'+i);root.replaceChildren();const note=document.createElement('p');note.textContent='Kies een alternatief. Stel bij een nieuw apparaat zelf een licht testgewicht in.';root.append(note);options.forEach(([n,s,r,w,u])=>{if(n===x.n)return;const b=document.createElement('button');b.style.margin='4px';b.textContent=n;b.onclick=()=>{if(x.done&&!confirm('Afgeronde oefening vervangen? De registratie van deze oefening vervalt.'))return;const prev=data.logs.flatMap(l=>l.items).filter(y=>y.n===n&&y.u===u).at(-1);data.draft.items[i]={n,s,r,w:prev?.w??w,u,done:false,e:'normaal',...(n===base?{}:{original:base})};save();render()};root.append(b)})}
function count(){let el=document.getElementById('count');if(el)el.textContent=data.draft.items.filter(x=>x.done).length+' / '+data.draft.items.length+' oefeningen afgerond'}function edit(i,k,val){data.draft.items[i][k]=val;save();count()}function switchDay(i){if(i===day)return;if(!confirm('Huidig concept vervangen?'))return;day=i;init();render()}function finish(){let items=data.draft.items.filter(x=>x.done);if(!items.length)return alert('Vink minimaal één afgeronde oefening aan.');if(items.some(x=>!Number.isFinite(x.w)||x.w<0||(x.w===0&&/^(kg|lb)/.test(x.u)&&x.u!=='kg extra')||x.s<1||x.r<1))return alert('Controleer de invoer.');data.logs.push({date:new Date().toISOString(),day,items});day=(day+1)%3;init();tab='Historie';render()}function graph(){let n=document.getElementById('exercise').value;let a=data.logs.flatMap(l=>l.items.filter(x=>x.n===n).map(x=>({...x,date:l.date})));let g=document.getElementById('graph');if(!a.length){g.innerHTML='<p>Nog geen geregistreerde resultaten.</p>';return}let useWeight=a.some(x=>x.w>0), vals=a.map(x=>useWeight?x.w:x.r), max=Math.max(...vals,1),pts=vals.map((y,i)=>[35+i*330/Math.max(1,vals.length-1),145-y/max*115]);g.innerHTML=`<article><h3>Beste: ${max} ${useWeight?esc(a[0].u):'herhalingen / tijd'}</h3><svg viewBox="0 0 400 175"><path d="M35 15 V145 H375" fill="none" stroke="#617381"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#0d9488" stroke-width="3"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4" fill="#0d9488"><title>${vals[i]}</title></circle>`).join('')}</svg>${a.slice(-10).reverse().map(x=>`<p>${new Date(x.date).toLocaleDateString('nl-NL')}: ${x.s} × ${x.r} · ${x.w} ${esc(x.u)}</p>`).join('')}</article>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='fitness-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(f){try{let d=JSON.parse(await f.text());if(!Array.isArray(d.logs)||d.logs.some(l=>!Array.isArray(l.items)||!Number.isInteger(l.day)||l.day<0||l.day>2))throw Error();if(!confirm('Huidige gegevens vervangen?'))return;data={logs:d.logs,draft:null};day=((data.logs.at(-1)?.day??-1)+1)%3;init();render()}catch{alert('Ongeldige backup')}}render();</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error);</script></html>
